{% extends "base.html" %}
{% block page_title %}Notifications{% endblock %}
{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../static/css/style.css">

{% if notifications %}
<div class="mt-card-list">
  {% for n in notifications %}
  <div class="mt-card" style="display:flex; justify-content:space-between; align-items:center; {{ 'opacity:0.6;' if n.is_read }}">
    <div>
      {{ n.message }}
      <div style="font-size:0.78rem; color:var(--mt-ink-soft); margin-top:4px;">{{ n.created_at }}</div>
    </div>
    {% if not n.is_read %}
    <form method="POST" action="{{ url_for('main.mark_notification_read', notification_id=n.id) }}">
      <button type="submit" class="mt-btn mt-btn-outline mt-btn-sm">Mark read</button>
    </form>
    {% endif %}
  </div>
  {% endfor %}
</div>
{% else %}
<div class="mt-empty">No notifications yet.</div>
{% endif %}

{% endblock %}
