services:
  - type: web
    name: medtrack
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m database.seed
    startCommand: gunicorn "app:app"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
